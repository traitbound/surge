[package]
name = "surge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "surge"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
ureq = { version = "2", features = ["json"] }
serde_json = { workspace = true }

[dev-dependencies]
surge-server = { path = "../server" }
surge-store = { path = "../store" }
surge-domain = { path = "../domain" }
tokio = { workspace = true }
axum = { workspace = true }
sqlx = { workspace = true }
tempfile = "3"
