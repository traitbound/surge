[package]
name = "surge-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "surge_server"
path = "src/lib.rs"

[[bin]]
name = "surge-server"
path = "src/main.rs"

[dependencies]
surge-domain = { path = "../domain" }
surge-store = { path = "../store" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
sqlx = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
