[workspace]
resolver = "2"
members = ["crates/domain", "crates/store", "crates/server", "crates/cli", "crates/compiler"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
axum = "0.8"
ts-rs = { version = "10", features = ["serde-compat"] }
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
lto = "thin"
